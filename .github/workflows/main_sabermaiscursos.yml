name: Build and deploy ASP.Net 8 app to Azure Web App - sabermaiscursos

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Clear NuGet cache
        run: dotnet nuget locals all --clear

      - name: Restore dependencies
        run: dotnet restore ./src/SaberMais.csproj --no-cache

      - name: Build project
        run: dotnet build ./src/SaberMais.csproj --configuration Release --no-restore

      - name: Publish project (x86) with web.config and stdoutLog
        run: |
          dotnet publish ./src/SaberMais.csproj `
            --configuration Release `
            --runtime win-x86 `
            --self-contained false `
            --output "${{ github.workspace }}/publish" `
            /p:AspNetCoreHostingModel=InProcess `
            /p:GenerateWebConfig=true `
            /p:EnableDefaultItems=true

          # Adiciona stdoutLogEnabled no web.config gerado
          $webConfig = "${{ github.workspace }}/publish/web.config"
          (Get-Content $webConfig) -replace 'stdoutLogEnabled="false"', 'stdoutLogEnabled="true"' | Set-Content $webConfig

      - name: Upload artifact for deployment
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ${{ github.workspace }}/publish

  deploy:
    runs-on: windows-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: .net-app
          path: ./publish

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_60C0199B00534946903CF36803CF36803A5C58A }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_244C43137A3647A0A6CEECD31129CFA9 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_FF34F626C8ED4578B914FC22D322A73F }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'sabermaiscursos'
          slot-name: 'Production'
          package: ./publish
