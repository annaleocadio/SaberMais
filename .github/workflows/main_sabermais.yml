name: Build and deploy ASP.Net Core app to Azure Web App - sabermais

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read # necessário para actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore ./src/SaberMais.csproj

      - name: Build with dotnet
        run: dotnet build ./src/SaberMais.csproj --configuration Release --no-restore

      - name: Publish project
        run: dotnet publish ./src/SaberMais.csproj -c Release -o ${{env.DOTNET_ROOT}}/myapp --no-build

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ${{env.DOTNET_ROOT}}/myapp

  deploy:
    runs-on: windows-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: .net-app
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_78CDB6F8A6C84303ABD368A05D80015D }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_7304B44415F54BA69BA747C0BECD7893 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_312BD793DFED423E9A8B541CA578235F }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'sabermais'
          slot-name: 'Production'
          package: .
